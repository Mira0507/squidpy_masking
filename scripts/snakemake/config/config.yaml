# Specify path to conda env
conda_env: '../../env'

# Specify path to a tab-separated sampletable, consisting of 
# the following columns:
# - samplename: unique sample identifier
# - input_image: path to a input image file
# - channel: "multi" for multi-channel IF images, "single" otherwise
sampletable: 'config/sampletable_new.txt'

# Output directory for converted images
out_converted: 'converted'

# Output directory for masked images
out_masked: "masked"

# Specify the series to be converted. 
# NOTE: 
# - Determine the series based on the input metadata. 
# - Select one for multi-channel with a desired resolution
# - If `None`, python specifies one series with the highest resolution
#   and multi-channel data
ser: None

# "Y" or "N". Set to "Y" if you want to save as pyramidal output
# See https://www.microscopesinternational.com/support/kb/article/ngn1076.aspx
pyramidal: Y

# Configure chunk size mode.
# - dynamic: set chunk size to the smaller image dimension, either width or height,
#            divided by chunk_ratio.
# - fixed: use chunk_size directly.
chunk_mode: dynamic
chunk_ratio: 8
chunk_size: 5000


# Specify the name of default input image layer in the ImageContainer obj
# Do not change this value unless you want to set a custom name by default
lyr: 'image'

# Lower and upper percentage of intensities for image normalization
# For very clean data, you could use 0 and 100.
# For very noisy data, you might use 2 and 98, or even 5 and 95.
lower_p: 1
upper_p: 99

# Specify normalization method after reviewing QC & normalization data
# NOTE: Review the `qc_normalization.html` summary file. Leaving this option
#       empty ("") will pause after the `qc_normalization` rule.
# - "raw": unnormalized
# - "clahe": CLAHE-mediated local contrast enhancement
# - "lognorm": log1p normalization
# - "percnorm": percentile rescaling
norm_method: ""

# Specify signal values to be tested for Gaussian smoothing
# Sigma represents the variance for normal distribution
gaussian_sigma: 1

# Specify whether input images will be cropped
crop_images: "N"

# Specify coordinates to crop images
# This section is omitted if the `crop_images` is set to "N"
crop_height: 0.5
crop_width: 0.5
crop_size: 1000
crop_scale: 1

# Specify methods for segmentation and thresholding. The `seg_method` and 
# `thr_method` will be passed into the `squidpy.im.process` function. 
# Refer to the following documentations for more info:
# - https://squidpy.readthedocs.io/en/stable/api/squidpy.im.process.html 
# - https://squidpy.readthedocs.io/en/latest/notebooks/examples/image/compute_segment_fluo.html
# Specify the `method` argument
seg_method: "watershed"
# Specify the `thresh` argument
thr_method: None



# Set parameters for adaptive thresholding.
#
# block_size:
#   Neighborhood size used to calculate the local threshold for each pixel.
#   Use an odd integer. A good starting range is 5-15% of the smaller image
#   dimension. If set to None, the native_thresholding rule derives a value
#   from the configured chunk size.
#
# offset:
#   Constant applied to the local threshold. The current implementation uses
#   this value in dask_image.ndfilters.threshold_local. Higher values make
#   thresholding more stringent and therefore keep fewer foreground pixels.
#   If set to None, the native_thresholding rule uses 0.
block_size: None
offset: None

# Specify the thresholding method of interest.
# - "squidpy": use the binary mask generated by Squidpy's default workflow.
# - "otsu": use Otsu/global thresholding generated by scikit-image/dask_image.
# - "adaptive": use adaptive/local thresholding generated by scikit-image/dask_image.
# - "": no selection; pause the pipeline before the post_processing rule.
thresholding: ""

# Configure foreground-object cleaning in the post_processing rule.
#
# cleaning_mode:
#   Controls how foreground masks are cleaned after thresholding.
#   - "adaptive": choose cleaning parameters per sample/channel from the
#     observed connected-component area distribution.
#   - "fixed": use the fixed minsize and morphology settings below.
#   - "off": skip erosion, dilation, and small-object removal; pass the
#     selected thresholding layer through as image_removal.
cleaning_mode: "adaptive"

# minsize:
#   Fixed minimum connected-component size in pixels. Components smaller than
#   this value are removed when cleaning_mode is "fixed". This value is also
#   used as the lower safety bound when adaptive_minsize_floor is unset or
#   cannot be parsed.
minsize: 20

# adaptive_minsize_method:
#   Method for deriving a per-channel minimum object size when cleaning_mode is
#   "adaptive".
#   - "log_otsu": apply Otsu thresholding to log1p(component_area). This is a
#     useful default when there are many tiny speckles and a separate population
#     of larger foreground objects.
#   - "quantile": use adaptive_minsize_quantile from the component-area
#     distribution. This is simpler and more stable when object-area
#     distributions are unimodal.
adaptive_minsize_method: "log_otsu"

# adaptive_minsize_quantile:
#   Quantile used only when adaptive_minsize_method is "quantile", or as a
#   fallback if "log_otsu" cannot be estimated because too few components are
#   present. Values should be between 0 and 1.
adaptive_minsize_quantile: 0.10

# adaptive_minsize_floor:
#   Lower bound for the adaptive min_size value. Keeping this at the historical
#   fixed minsize avoids weakening the current speckle-removal behavior on
#   noisy images.
adaptive_minsize_floor: 20

# adaptive_minsize_ceiling:
#   Upper bound for the adaptive min_size value. This prevents the automatic
#   rule from removing biologically meaningful foreground objects when an image
#   has unusually large connected components.
adaptive_minsize_ceiling: 500

# adaptive_min_components:
#   Minimum number of connected components required to estimate adaptive
#   cleaning parameters for a channel. If fewer components are detected, the
#   post_processing rule falls back to adaptive_minsize_floor.
adaptive_min_components: 25

# morphology_mode:
#   Controls erosion/dilation behavior in post_processing.
#   - "adaptive": choose whether to run morphology per channel based on
#     foreground fraction and object-size statistics.
#   - "fixed": always apply the historical erosion followed by dilation.
#   - "off": skip erosion and dilation, then run only small-object removal.
morphology_mode: "adaptive"

# fixed_erosion_connectivity:
#   Connectivity used for fixed erosion. A value of 1 uses only orthogonal
#   neighbors; a value of 2 also uses diagonal neighbors. The historical
#   post_processing behavior uses 2.
fixed_erosion_connectivity: 2

# fixed_dilation_connectivity:
#   Connectivity used for fixed dilation. The historical post_processing
#   behavior uses 1 to partially recover object boundaries after stronger
#   erosion.
fixed_dilation_connectivity: 1

# adaptive_foreground_fraction_min:
#   If the foreground fraction is below this value, adaptive morphology is
#   skipped for that channel to avoid eroding already sparse signal.
adaptive_foreground_fraction_min: 0.001

# adaptive_foreground_fraction_max:
#   If the foreground fraction is above this value, adaptive morphology is
#   applied conservatively because dense masks are more likely to contain
#   merged foreground regions.
adaptive_foreground_fraction_max: 0.50

# cleaning_summary:
#   Name of the tab-separated summary file written by post_processing. It will
#   contain per-sample/per-channel object statistics and the selected adaptive
#   cleaning parameters.
cleaning_summary: "cleaning_summary.tsv"

# Specify the size factor for downsizing arrays during watershed segmentation.
# This is used for finding local maxima of the distance to the background.
downfactor: 4

# Specify pseudo-colors for individual channels. Ensure the order aligns with
# the order of your channels (0-indexing)
pseudo_cols:
  dapi: dodgerblue  # channel 0
  iba: orange       # channel 1
  tdp: limegreen    # channel 2
  map: violet       # channel 3
  aldh: lightblue   # channel 4

# Specify antibodies of interest to be merged
merge_list:
  - dapi_tdp
  - iba_map_aldh
  - tdp_map
  
# Specify the suffix of image layers saved in Squidpy's `ImageContainer` object
merge_layer: 'removal'
